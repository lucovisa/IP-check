<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IP Checker</title>
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="layout">

  <div class="sidebar">
    <h2>История</h2>
    <div class="history-wrapper">
      <div id="history"></div>
    </div>
    <button id="clearHistory">Очистить</button>
  </div>

  <div class="main">
    <h1>IP Checker</h1>

    <button id="check">Проверить мой IP</button>

    <div class="search">
      <div class="input-wrapper">
        <input id="ipInput" placeholder="Введите IP">
        <div class="ip-error" id="ipError">Неверный IP-адрес</div>
      </div>
      <button id="checkIp">Проверить</button>
    </div>

    <div id="result"></div>

    <div class="actions-row">
      <button id="copyAll" style="display:none">Скопировать всё</button>
      <button id="downloadTxt" style="display:none">Скачать отчёт .txt</button>
    </div>
  </div>

  <div class="speed">
    <h2>Speed Test</h2>
    <button id="speedStart">Начать тест</button>
    <div id="speedResult"></div>
  </div>

</div>

<script src="script.js"></script>
<script src="speedtest.js"></script>

</body>
</html>

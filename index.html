<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IP Checker & Speedtest — Узнай свой IP и проверь скорость</title>
  <meta name="description" content="Быстрая проверка IP, местоположения, провайдера и тест скорости интернета. История запросов, копирование и скачивание отчёта. Никакой воды — только цифры.">
  <meta name="keywords" content="IP checker, проверка IP, speedtest, тест скорости, узнать свой IP, интернет скорость, hacker, IP lookup, локация, провайдер, онлайн тест, анонимность, сеть, network tools, ping, whois, IP address, интернет скорость тест, хакерские штуки, my ip, check ip, ip scanner">
  <meta name="author" content="IP Checker">
  <meta name="robots" content="index, follow">

 
  <meta property="og:type" content="website">
  <meta property="og:title" content="IP Checker & Speedtest — Проверь IP и скорость за секунду">
  <meta property="og:description" content="Мгновенная проверка IP-адреса, провайдера и скорости интернета. Работает без заморочек.">
  <meta property="og:url" content="https://lucovisa.github.io/IP-check">
  <meta property="og:locale" content="ru_RU">

  
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="IP Checker & Speedtest">
  <meta name="twitter:description" content="Проверь IP, узнай местоположение и скорость интернета. Быстро и честно.">
  <meta name="twitter:image" content="icon.png">

  <meta property="og:image" content="https://lucovisa.github.io/IP-check/og-image.svg">
  <meta property="og:image:type" content="image/svg+xml">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">

  
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="layout">

  <div class="sidebar">
    <h2>История</h2>
    <div class="history-wrapper">
      <div id="history"></div>
    </div>
    <button id="clearHistory">Очистить</button>
  </div>

  <div class="main">
    <h1>IP Checker</h1>

    <button id="check">Проверить мой IP</button>

    <div class="search">
      <div class="input-wrapper">
        <input id="ipInput" placeholder="Введите IP">
        <div class="ip-error" id="ipError">Неверный IP-адрес</div>
      </div>
      <button id="checkIp">Проверить</button>
    </div>

    <div id="result"></div>

    <div class="actions-row">
      <button id="copyAll" style="display:none">Скопировать всё</button>
      <button id="downloadTxt" style="display:none">Скачать отчёт .txt</button>
    </div>
  </div>

  <div class="speed">
    <h2>Speed Test</h2>
    <button id="speedStart">Начать тест</button>
    <div id="speedResult"></div>
  </div>

</div>

<script src="script.js"></script>
<script src="speedtest.js"></script>

</body>
</html>
